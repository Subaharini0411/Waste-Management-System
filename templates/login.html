{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reporter Login</title>

<link rel="stylesheet" href="{% static 'css/style.css' %}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header>

<h1>
<i class="fa-solid fa-right-to-bracket"></i>
Reporter Login
</h1>

</header>

<nav>

<a href="/">
<i class="fa-solid fa-house"></i> Home
</a>

<a href="/waste-information/">
<i class="fa-solid fa-recycle"></i> Waste Information
</a>

<a href="/about/">
<i class="fa-solid fa-circle-info"></i> About
</a>

<a href="/contact/">
<i class="fa-solid fa-phone"></i> Contact
</a>

<a href="/feedback/">
<i class="fa-solid fa-comments"></i> Feedback
</a>

</nav>

<section class="hero">

<div class="form-container">

<h2>Login to Your Account</h2>

<form id="loginForm">

<label>
<i class="fa-solid fa-envelope"></i>
Email Address
</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

<label>
<i class="fa-solid fa-lock"></i>
Password
</label>

<input
type="password"
id="password"
placeholder="Enter your password"
required>

<button type="submit">

<i class="fa-solid fa-right-to-bracket"></i>

Login

</button>

</form>

<p style="text-align:center; margin-top:20px;">

Don't have an account?

<a href="/register/">

<b>Register</b>

</a>

</p>

</div>

</section>

<footer>

© 2026 Real Life Waste Management System

</footer>

<script>

document.getElementById("loginForm").addEventListener("submit", function(e){

e.preventDefault();

fetch("/login/check/", {

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:document.getElementById("email").value,

password:document.getElementById("password").value

})

})

.then(response => response.json())

.then(data => {

if(data.success){

alert(data.message);

// Redirect to the page sent by Django
window.location.href = data.redirect;

}else{

alert(data.message);

}

})

.catch(error => {

alert("Something went wrong!");

});

});

</script>

</body>

</html>
